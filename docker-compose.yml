version: '3.8'

services:
  marketing:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-marketing-site
    container_name: school-marketing-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      # Bind storage so logs/uploads persist on the host (and survive image rebuilds).
      - ./storage:/var/www/html/storage
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
